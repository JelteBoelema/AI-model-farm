# Full local stack: PostgreSQL, Redis, MinIO (S3-compatible), migrations, web and one worker per role.
# Usage: cp .env.example .env && docker compose up --build
name: creator-farm

x-app-env: &app-env
  APP_ENV: development
  DATABASE_URL: postgresql://creatorfarm:creatorfarm@postgres:5432/creatorfarm
  REDIS_URL: redis://redis:6379/0
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
  AUTH_URL: http://localhost:3000
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
  MOCK_MODE: ${MOCK_MODE:-true}
  STORAGE_DRIVER: s3
  S3_BUCKET: creator-farm-media
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:16.6-alpine
    environment: { POSTGRES_USER: creatorfarm, POSTGRES_PASSWORD: creatorfarm, POSTGRES_DB: creatorfarm }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U creatorfarm"], interval: 5s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/creator-farm-media && mc anonymous set none local/creator-farm-media"]

  migrate:
    build: { context: ., target: migrate }
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., target: web }
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker-scheduler:
    build: { context: ., target: worker }
    environment: { <<: *app-env, WORKER_QUEUES: scheduler, SERVICE_NAME: worker-scheduler }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  worker-generation:
    build: { context: ., target: worker }
    environment: { <<: *app-env, WORKER_QUEUES: generation, SERVICE_NAME: worker-generation }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  worker-media:
    build: { context: ., target: worker }
    environment: { <<: *app-env, WORKER_QUEUES: media, SERVICE_NAME: worker-media }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  worker-publishing:
    build: { context: ., target: worker }
    environment: { <<: *app-env, WORKER_QUEUES: publishing, SERVICE_NAME: worker-publishing }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

volumes:
  pgdata:
  redisdata:
  miniodata:
