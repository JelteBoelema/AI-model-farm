name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: creatorfarm, POSTGRES_PASSWORD: creatorfarm, POSTGRES_DB: creatorfarm_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creatorfarm" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://creatorfarm:creatorfarm@localhost:5432/creatorfarm_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: creatorfarm, POSTGRES_PASSWORD: creatorfarm, POSTGRES_DB: creatorfarm_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creatorfarm" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://creatorfarm:creatorfarm@localhost:5432/creatorfarm_e2e
      E2E_REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: Build images
    runs-on: ubuntu-24.04
    needs: [quality]
    strategy:
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: creator-farm/${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # Container scan: fixable high/critical vulnerabilities in OS packages or dependencies fail the build.
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.57.1 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format json --output /out/trivy.json \
            creator-farm/${{ matrix.target }}:ci
          # One annotation per finding, then fail if there were any.
          python3 - <<'PY'
          import json, sys
          found = 0
          for r in json.load(open("trivy.json")).get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  found += 1
                  print(f"::error title={v['VulnerabilityID']} ({v['Severity']})::{r['Target']}: {v['PkgName']} {v['InstalledVersion']} -> {v.get('FixedVersion', '?')}")
          sys.exit(1 if found else 0)
          PY

  dependencies:
    name: Dependency & secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      # No install here (audit reads the lockfile), so no dependency cache either.
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Scan the repository history for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --no-banner --redact --verbose
      # Every finding is fixed or skipped in the code with a written reason (#checkov:skip=...).
      - name: Scan infrastructure code and Dockerfile for misconfigurations
        run: |
          pipx run --spec checkov==3.2.334 checkov -d infra/terraform --framework terraform --compact --quiet
          pipx run --spec checkov==3.2.334 checkov -f Dockerfile --framework dockerfile --compact --quiet

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
