# Publishes images to GHCR after CI passes on main. Deployment to the cloud runtime is a separate,
# manually approved job (GitHub environment "production" with required reviewers).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:main
          cache-from: type=gha,scope=${{ matrix.target }}

  deploy:
    needs: [images]
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run database migrations (one-off ECS task)
        run: |
          aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --launch-type FARGATE \
            --task-definition creator-farm-migrate \
            --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" \
            --overrides '{"containerOverrides":[{"name":"migrate","image":"ghcr.io/${{ github.repository }}/migrate:${{ github.sha }}"}]}' \
            --query 'tasks[0].taskArn' --output text > task.txt
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$(cat task.txt)"
          code=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$(cat task.txt)" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$code" = "0"
      - name: Roll out services
        run: |
          for svc in web worker-scheduler worker-generation worker-media worker-publishing; do
            aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "creator-farm-$svc" --force-new-deployment > /dev/null
          done
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services creator-farm-web
